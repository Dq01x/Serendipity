<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万圣节抽签</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%230b0607'/%3E%3Ccircle%20cx='16'%20cy='17'%20r='9'%20fill='%23d4131e'/%3E%3Cpath%20d='M12%2011l2%204M20%2011l-2%204M11%2019l2%202%202-1%202%202%202-2%202%201%202-2'%20stroke='%230b0607'%20stroke-width='2'%20fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0b0607;
    --bg2:#120a0c;
    --panel:#160b0e;
    --panel-line:#3a1015;
    --ink:#e8d4cd;
    --ink-dim:#a88277;
    --blood:#d4131e;
    --crimson:#7d0910;
    --ember:#ff4d3d;
    --ember-soft:#ff6a45;
    --shadow:rgba(0,0,0,.55);
    --serif:"Noto Serif SC", "Songti SC", STSong, serif;
    --sans:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--sans);
    background:radial-gradient(120% 90% at 50% 0%, var(--bg2) 0%, var(--bg) 60%);
    color:var(--ink);
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--blood); color:#fff; }

  /* ===== 背景装饰层（血月 / 迷雾 / 蝙蝠 / 磷火） ===== */
  .scene{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .moon{
    position:absolute; top:-12%; left:50%; transform:translateX(-50%);
    width:min(72vw,360px); height:min(72vw,360px); border-radius:50%;
    background:radial-gradient(circle at 38% 36%, #ff6a45 0%, var(--blood) 42%, #5f070d 78%, #3c0409 100%);
    box-shadow:0 0 120px 30px rgba(212,19,30,.35), inset 0 0 40px rgba(0,0,0,.5);
    opacity:.9;
  }
  .moon::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 28% 30%, rgba(0,0,0,.28) 0 4px, transparent 5px),
               radial-gradient(circle at 60% 60%, rgba(0,0,0,.22) 0 6px, transparent 7px),
               radial-gradient(circle at 45% 22%, rgba(0,0,0,.2) 0 3px, transparent 4px),
               radial-gradient(circle at 72% 34%, rgba(0,0,0,.18) 0 4px, transparent 5px);
  }
  .fog{
    position:absolute; left:-10%; right:-10%; bottom:-22vh; height:40vh;
    background:radial-gradient(50% 60% at 50% 100%, rgba(212,19,30,.28), transparent 70%);
    filter:blur(6px);
  }
  .bat{ position:absolute; fill:var(--crimson); opacity:.85; will-change:transform; }
  .bat-b1{ top:16%; left:-60px; width:56px; animation:fly1 26s linear infinite; }
  .bat-b2{ top:30%; left:-70px; width:44px; opacity:.6; animation:fly2 38s linear infinite; }
  .bat-b3{ top:52%; left:-50px; width:34px; opacity:.5; animation:fly3 30s linear infinite; }
  .bat-b4{ top:66%; left:-60px; width:40px; opacity:.7; animation:fly1 44s linear infinite; }
  @keyframes fly1{ 0%{ transform:translateX(0) translateY(0) scaleX(1);} 30%{ transform:translateX(38vw) translateY(-18px) scaleX(.7);} 60%{ transform:translateX(76vw) translateY(10px) scaleX(1);} 90%{ transform:translateX(120vw) translateY(-12px) scaleX(.85);} 100%{ transform:translateX(140vw) translateY(0) scaleX(1);} }
  @keyframes fly2{ 0%{ transform:translateX(0) translateY(0);} 40%{ transform:translateX(60vw) translateY(14px);} 100%{ transform:translateX(150vw) translateY(-8px);} }
  @keyframes fly3{ 0%{ transform:translateX(0) translateY(0) scaleX(1);} 50%{ transform:translateX(90vw) translateY(-20px) scaleX(.8);} 100%{ transform:translateX(160vw) translateY(8px) scaleX(1);} }
  .ember{
    position:absolute; bottom:-6px; width:6px; height:6px; border-radius:50%;
    background:var(--ember); box-shadow:0 0 10px 2px rgba(255,77,61,.55);
    animation:rise linear infinite; opacity:0;
  }
  .e1{ left:12%; animation-duration:9s; animation-delay:0s; }
  .e2{ left:28%; width:4px;height:4px; animation-duration:12s; animation-delay:2.5s; }
  .e3{ left:46%; width:7px;height:7px; animation-duration:10s; animation-delay:1s; }
  .e4{ left:63%; width:5px;height:5px; animation-duration:14s; animation-delay:4s; }
  .e5{ left:78%; width:4px;height:4px; animation-duration:11s; animation-delay:3s; }
  .e6{ left:90%; width:6px;height:6px; animation-duration:9.5s; animation-delay:1.8s; }
  @keyframes rise{
    0%{ transform:translateY(0); opacity:0; }
    12%{ opacity:.9; }
    100%{ transform:translateY(-92vh); opacity:0; }
  }

  /* ===== 角落蜘蛛网 ===== */
  .web{ position:fixed; z-index:1; pointer-events:none; color:rgba(232,212,205,.18); }
  .web-tl{ top:-8px; left:-8px; width:140px; }
  .web-tr{ top:-8px; right:-8px; width:120px; transform:scaleX(-1); }
  .web-bl{ bottom:-8px; left:-8px; width:120px; transform:scaleY(-1); }

  /* ===== 主布局 ===== */
  .app{
    position:relative; z-index:2;
    max-width:520px; margin:0 auto;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:72px 22px 40px; text-align:center;
  }

  .sound-toggle{
    position:absolute; top:16px; right:16px; z-index:5;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(125,9,16,.25); border:1px solid var(--panel-line);
    color:var(--ink-dim); cursor:pointer; transition:.2s;
  }
  .sound-toggle:hover{ color:var(--ink); border-color:var(--blood); }
  .sound-toggle:focus-visible{ outline:2px solid var(--blood); outline-offset:2px; }
  .sound-toggle svg{ width:22px; height:22px; }
  .sound-toggle.muted{ opacity:.5; }

  header{ margin-bottom:26px; }
  .kicker{
    font-size:12px; letter-spacing:.45em; color:var(--ember-soft);
    text-transform:uppercase; margin-bottom:14px; text-shadow:0 0 12px rgba(255,77,61,.5);
  }
  h1{
    font-family:var(--serif); font-weight:900; font-size:clamp(38px, 11vw, 54px);
    line-height:1.12; letter-spacing:.04em;
    background:linear-gradient(180deg, var(--ember-soft) 0%, var(--blood) 55%, var(--crimson) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 14px rgba(212,19,30,.45));
  }
  .sub{ margin-top:12px; color:var(--ink-dim); font-size:15px; letter-spacing:.14em; }

  /* ===== 签卡 ===== */
  .card{
    position:relative; width:100%;
    background:linear-gradient(160deg, rgba(22,11,14,.92), rgba(11,6,7,.96));
    border:1px solid var(--panel-line); border-radius:18px;
    padding:26px 24px 30px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.8), inset 0 0 40px rgba(125,9,16,.12);
  }
  .card::before, .card::after{
    content:""; position:absolute; width:16px; height:16px; pointer-events:none;
  }
  .card::before{ top:9px; left:9px; border-top:2px solid var(--blood); border-left:2px solid var(--blood); }
  .card::after{ bottom:9px; right:9px; border-bottom:2px solid var(--blood); border-right:2px solid var(--blood); }
  .card-badge{
    display:inline-block; font-size:12px; letter-spacing:.3em; color:var(--ink-dim);
    border:1px solid var(--panel-line); border-radius:999px; padding:5px 14px; margin-bottom:20px;
  }
  .draw-tag{
    font-size:13px; color:var(--ember-soft); letter-spacing:.2em; margin-bottom:14px;
    text-shadow:0 0 10px rgba(255,77,61,.35); min-height:1.2em;
  }
  .result{
    min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:clamp(22px, 6vw, 30px); line-height:1.5;
  }
  .result-text{ color:var(--ink); transition:.3s; }
  .result .hint{ color:var(--ink-dim); font-size:clamp(14px,4vw,16px); font-family:var(--sans); font-weight:400; letter-spacing:.05em; }
  .result.revealed .result-text{
    color:var(--ember-soft);
    text-shadow:0 0 18px rgba(255,77,61,.45), 0 0 4px rgba(212,19,30,.6);
  }
  .caret{
    display:inline-block; width:2px; height:1.1em; margin-left:2px;
    background:var(--ember); vertical-align:-2px;
    animation:blink .9s step-end infinite;
  }
  .caret.hidden{ display:none; }
  @keyframes blink{ 50%{ opacity:0; } }

  .counter{ margin:18px 0 24px; color:var(--ink-dim); font-size:14px; letter-spacing:.08em; }
  .counter b{ color:var(--ink); font-weight:700; font-size:18px; }

  /* ===== 题库切换按钮（上下竖排·胶囊圆框） ===== */
  .counter{ margin:18px 0 10px; }
  .bank-switch{ display:flex; flex-direction:column; align-items:center; gap:16px; margin:14px 0 0; width:100%; }
  .bank-btn{
    cursor:pointer; appearance:none; border:1px solid var(--panel-line);
    background:rgba(125,9,16,.18); color:var(--ink-dim);
    padding:11px 0; border-radius:999px; font-family:var(--serif);
    font-size:16px; letter-spacing:.12em; transition:.2s; min-height:44px; width:min(66%, 230px);
  }
  .bank-btn:hover{ color:var(--ink); border-color:var(--blood); }
  .bank-btn:focus-visible{ outline:2px solid var(--ember); outline-offset:2px; }
  .bank-btn:disabled{ opacity:.5; cursor:default; }

  .is-hidden{ display:none !important; }
  .draw-btn:not(.is-hidden){ animation:fadeUp .35s ease; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  /* ===== 抽签按钮 ===== */
  .draw-btn{
    appearance:none; border:none; cursor:pointer;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width:min(100%, 320px); padding:18px 24px; border-radius:999px;
    background:linear-gradient(180deg, var(--blood) 0%, var(--crimson) 100%);
    color:#fff; box-shadow:0 12px 34px -10px rgba(212,19,30,.75), inset 0 1px 0 rgba(255,255,255,.25);
    font-family:var(--serif); font-weight:700; font-size:20px; letter-spacing:.18em;
    transition:transform .15s, box-shadow .2s, filter .2s;
  }
  .draw-btn:hover:not(:disabled){ filter:brightness(1.12); transform:translateY(-2px); }
  .draw-btn:active:not(:disabled){ transform:translateY(0) scale(.97); }
  .draw-btn:focus-visible{ outline:2px solid var(--ember); outline-offset:3px; }
  .draw-btn:disabled{ cursor:default; opacity:.72; filter:grayscale(.3); }
  .draw-btn svg{ display:none; }
  .draw-btn.label-only{ justify-content:center; }

  .foot{ margin-top:34px; font-size:12px; color:var(--ink-dim); letter-spacing:.12em; }

  /* ===== 响应式 ===== */
  @media (min-width:768px){
    .app{ padding-top:84px; }
    .card{ padding:30px 34px 34px; }
  }

  @media (prefers-reduced-motion: reduce){
    .bat, .ember{ animation:none; opacity:.4; }
    .caret{ animation:none; opacity:.6; }
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

  <!-- ===== 背景装饰 ===== -->
  <div class="scene" aria-hidden="true">
    <div class="moon"></div>
    <svg class="bat bat-b1" viewBox="0 0 60 30"><path d="M30 15 C20 4 8 6 4 12 C14 12 18 16 20 22 C24 14 28 13 30 15 Z M30 15 C40 4 52 6 56 12 C46 12 42 16 40 22 C36 14 32 13 30 15 Z"/></svg>
    <svg class="bat bat-b2" viewBox="0 0 60 30"><path d="M30 15 C20 4 8 6 4 12 C14 12 18 16 20 22 C24 14 28 13 30 15 Z M30 15 C40 4 52 6 56 12 C46 12 42 16 40 22 C36 14 32 13 30 15 Z"/></svg>
    <svg class="bat bat-b3" viewBox="0 0 60 30"><path d="M30 15 C20 4 8 6 4 12 C14 12 18 16 20 22 C24 14 28 13 30 15 Z M30 15 C40 4 52 6 56 12 C46 12 42 16 40 22 C36 14 32 13 30 15 Z"/></svg>
    <svg class="bat bat-b4" viewBox="0 0 60 30"><path d="M30 15 C20 4 8 6 4 12 C14 12 18 16 20 22 C24 14 28 13 30 15 Z M30 15 C40 4 52 6 56 12 C46 12 42 16 40 22 C36 14 32 13 30 15 Z"/></svg>
    <div class="fog"></div>
    <div class="ember e1"></div><div class="ember e2"></div><div class="ember e3"></div>
    <div class="ember e4"></div><div class="ember e5"></div><div class="ember e6"></div>
  </div>

  <svg class="web web-tl" viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M0 0 H120 M0 0 V120"/>
    <path d="M0 0 L120 40 M0 0 L40 120 M0 0 L110 80 M0 0 L80 110"/>
    <path d="M10 20 Q40 30 30 70 M20 10 Q60 40 80 20"/>
  </svg>
  <svg class="web web-tr" viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M0 0 H120 M0 0 V120"/>
    <path d="M0 0 L120 40 M0 0 L40 120 M0 0 L110 80 M0 0 L80 110"/>
  </svg>
  <svg class="web web-bl" viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M0 0 H120 M0 0 V120"/>
    <path d="M0 0 L120 40 M0 0 L40 120 M0 0 L110 80 M0 0 L80 110"/>
  </svg>

  <main class="app">
    <button class="sound-toggle" id="soundBtn" aria-pressed="false" aria-label="音效开关">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/>
        <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
      </svg>
    </button>

    <header>
      <p class="kicker">halloween</p>
      <h1>万圣节抽签</h1>
      <p class="sub">夜幕降临 · 命运交由红签决定</p>
    </header>

    <section class="card" aria-live="polite">
      <span class="card-badge">抽签台</span>
      <div class="draw-tag" id="drawTag">尚未开抽</div>
      <div class="result" id="result">
        <p class="result-text hint" id="resultText">请先选择题库</p>
        <span class="caret hidden" id="caret"></span>
      </div>
    </section>

    <div class="bank-switch" id="bankSwitch">
      <button class="bank-btn" id="bank1Btn" type="button">题库 1</button>
      <button class="bank-btn" id="bank2Btn" type="button">题库 2</button>
    </div>

    <div class="counter is-hidden" id="counterBox">已抽 <b id="count">0</b> 签</div>

    <button class="draw-btn is-hidden" id="drawBtn" type="button">
      <span>抽 一 签</span>
    </button>

    <p class="foot">万圣夜 · 胆敢点下，就别想反悔</p>
  </main>

<script>
  /* ===== 题库 ===== */
  const ITEM_POOL_1 = [
    '让对方喊自己妈妈',
    '让对方说"我爱你"',
    '让对方换装扮',
    '让对方叭叭叫',
    '让对方答应你的一个要求',
    '让对方学你说话',
    '让对方说脏话（包括且不限于有病、草、傻逼等）',
    '让对方说出想客诉\\陪诉',
    '让对方做动作',
    '让对方叫你的名字',
    '让对方发一句颜文字',
    '让对方说一句"喵"并解释原因',
    '让对方用一句话证明自己不是AI',
    '让对方说出"你赢了"',
    '让对方说一句土味情话',
    '让对方用喊你"宝贝"并加波浪号',
    '在对方面前背诵古诗不被发现',
    '让对方给你起一个外号',
    '让对方说出一句网络热梗',
    '让对方说出一个成语',
    '让对方跟你撒娇',
    '让对方说"巴巴卜一"',
    '让对方求你',
    '让对方夸你一句',
    '说"阿帕次"不被对方发现',
    '让对方做一道数学题（1+1这种也行）',
    '让对方说英文（单词也行）',
    '让对方说"我申请当你的电子宠物"',
    '让对方给你们起一个组合名',
    '让对方说出一个食物',
    '让对方单发一个问号',
    '让对方主动贴贴你',
    '让对方跳舞',
    '让对方坐下',
    '让对方说你很萌',
    '让对方发地刺攻击',
    '让对方单发一个"嗯"'
  ];

  const ITEM_POOL_2 = [
    '有人说你我他就磕头',
    '有人说"笑"就学狗叫',
    '有人走路就大喊皇上驾到',
    '有人叫一下就说一句蛇漪nb',
    '有人说话超过10个字，就说老奴好久没看小姐这么笑过了',
    '有人叫别人的名字就说康神开播了，真的假的',
    '有人扣一个问号（包括动作）就唱一句我从山中来带着兰花草',
    '有人坐下就说大屁屁攻击，都来受死吧',
    '有人说话就大哭',
    '有人做动作就跳一段失信舞',
    '全场安静就追着一个人喊妈妈亲亲',
    '有人换装扮就说一句祝福语',
    '有人拉腿就说三遍我是傻子',
    '有人起飞就说一句霸总玛丽苏语录',
    '有人喝茶\\吃点心就选个人到她面前去撒个娇',
    '有人抱玩偶就找个人深情表白',
    '有人大叫就对着一个人疯狂扣问号',
    '有人说"我求你了"就唱我们一起学猫叫一起喵喵喵喵喵喵',
    '有人接话就追着一个人喊死鬼～',
    '有人发句号就躺下说"来吧宝贝儿我准备好了"'
  ];

  let CURRENT_POOL = ITEM_POOL_1;

  const state = { draws: 0, drawing: false, muted: false };

  const resultEl    = document.getElementById('result');
  const textEl      = document.getElementById('resultText');
  const caretEl     = document.getElementById('caret');
  const tagEl       = document.getElementById('drawTag');
  const countEl     = document.getElementById('count');
  const counterBox  = document.getElementById('counterBox');
  const btnEl       = document.getElementById('drawBtn');
  const soundBtn    = document.getElementById('soundBtn');

  /* ===== 题库选择 ===== */
  const bankBtn1 = document.getElementById('bank1Btn');
  const bankBtn2 = document.getElementById('bank2Btn');
  const bankSwitch = document.getElementById('bankSwitch');
  function selectBank(n){
    if (state.drawing) return;
    CURRENT_POOL = n === 2 ? ITEM_POOL_2 : ITEM_POOL_1;
    // 选好题库后：隐藏题库按钮，揭晓抽签按钮和计数（即 P3 状态）
    bankSwitch.classList.add('is-hidden');
    btnEl.classList.remove('is-hidden');
    counterBox.classList.remove('is-hidden');
    // 重置结果区为提示态
    textEl.className = 'result-text hint';
    textEl.textContent = '点击下方按钮，抽取你的万圣签';
    caretEl.classList.add('hidden');
    resultEl.classList.remove('revealed');
  }
  bankBtn1.addEventListener('click', () => selectBank(1));
  bankBtn2.addEventListener('click', () => selectBank(2));

  /* ===== 音效（Web Audio，需用户先点击一次才会启动） ===== */
  let actx = null;
  function ensureAudio(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }
  function noiseBuffer(dur){
    const len = Math.max(1, Math.floor(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  // 蝙蝠煽动翅膀：两三下带扫频的扑翅声
  function wingFlap(when){
    const t = actx.currentTime + when;
    const src = actx.createBufferSource();
    src.buffer = noiseBuffer(0.13);
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(680, t);
    bp.frequency.exponentialRampToValueAtTime(200, t + 0.11);
    bp.Q.value = 1.4;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    src.start(t); src.stop(t + 0.13);
  }
  // 蜘蛛哈气：缓慢起伏的嘶嘶气声
  function spiderHiss(){
    const t = actx.currentTime;
    const src = actx.createBufferSource();
    src.buffer = noiseBuffer(0.55);
    src.loop = true;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 880; bp.Q.value = 9;
    const lfo = actx.createOscillator(); lfo.frequency.value = 6;
    const lg = actx.createGain(); lg.gain.value = 160;
    lfo.connect(lg); lg.connect(bp.frequency);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.2);
    g.gain.linearRampToValueAtTime(0.035, t + 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    src.start(t); lfo.start(t);
    src.stop(t + 1.15); lfo.stop(t + 1.15);
  }
  function playDraw(){
    if (state.muted) return;
    ensureAudio();
    // 抽签瞬间：蝙蝠煽动翅膀
    wingFlap(0); wingFlap(0.12); wingFlap(0.26);
  }
  function playReveal(){
    if (state.muted) return;
    ensureAudio();
    // 揭晓：蜘蛛哈气
    spiderHiss();
  }
  soundBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    soundBtn.classList.toggle('muted', state.muted);
    soundBtn.setAttribute('aria-pressed', String(state.muted));
    ensureAudio();
  });

  /* ===== 打字机揭晓 ===== */
  function typeResult(text){
    textEl.className = 'result-text hint';
    textEl.textContent = '';
    caretEl.classList.remove('hidden');
    resultEl.classList.remove('revealed');
    let i = 0;
    return new Promise(resolve => {
      const iv = setInterval(() => {
        textEl.textContent = text.slice(0, ++i);
        if (i >= text.length) {
          clearInterval(iv);
          caretEl.classList.add('hidden');
          resultEl.classList.add('revealed');
          playReveal();
          resolve();
        }
      }, 72);
    });
  }

  /* ===== 抽签主流程 ===== */
  btnEl.addEventListener('click', async () => {
    if (state.drawing) return;
    state.drawing = true;
    btnEl.disabled = true;
    bankBtn1.disabled = true;
    bankBtn2.disabled = true;
    playDraw();

    const pick = CURRENT_POOL[Math.floor(Math.random() * CURRENT_POOL.length)];
    state.draws += 1;
    countEl.textContent = String(state.draws);
    tagEl.textContent = '第 ' + state.draws + ' 签';

    await typeResult(pick);

    state.drawing = false;
    btnEl.disabled = false;
    bankBtn1.disabled = false;
    bankBtn2.disabled = false;
  });
</script>
</body>
